---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: robot-telemetry
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::827913617635:role/robot-telemetry-api-irsa  # replace with actual ARN

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-telemetry-api
  namespace: robot-telemetry
  labels:
    app: robot-telemetry-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-telemetry-api
  template:
    metadata:
      labels:
        app: robot-telemetry-api
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      serviceAccountName: api-sa
      containers:
        - name: api
          image: 827913617635.dkr.ecr.eu-west-1.amazonaws.com/robot-telemetry-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: BEDROCK_MODEL_ID
              value: "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"
            - name: ATHENA_DATABASE
              value: "robot_telemetry_db"
            - name: ATHENA_WORKGROUP
              value: "robot-telemetry-workgroup"
            - name: ATHENA_OUTPUT_LOCATION
              value: "s3://de-ai-06-smartfactory-bucket/project-athena-results/"
            - name: CACHE_REFRESH_HOUR
              value: "1"
            - name: AWS_DEFAULT_REGION
              value: "eu-west-1"
            # NOTE: GRAFANA_URL은 SSM /robot-telemetry/grafana-url 에서 런타임 조회 (Late-binding)
            # 환경변수 주입은 fallback 용도 — post-deploy job이 SSM 갱신 후 자동 사용
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: robot-telemetry-api
  namespace: robot-telemetry
spec:
  type: ClusterIP
  selector:
    app: robot-telemetry-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
