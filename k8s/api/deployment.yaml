---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: robot-telemetry
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::__AWS_ACCOUNT_ID__:role/robot-telemetry-api-irsa  # replace with actual ARN

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-telemetry-api
  namespace: robot-telemetry
  labels:
    app: robot-telemetry-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: robot-telemetry-api
  template:
    metadata:
      labels:
        app: robot-telemetry-api
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      serviceAccountName: api-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: robot-telemetry-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/robot-telemetry-api:__IMAGE_TAG__
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: PORTAL_AUTH_MODE
              value: "required"
            - name: BEDROCK_MODEL_ID
              value: "apac.anthropic.claude-3-5-sonnet-20241022-v2:0"
            - name: BEDROCK_FALLBACK_MODEL_ID
              value: "apac.amazon.nova-lite-v1:0"
            - name: ATHENA_DATABASE
              value: "robot_telemetry_db"
            - name: ATHENA_WORKGROUP
              value: "robot-telemetry-workgroup"
            - name: ATHENA_OUTPUT_LOCATION
              value: "s3://__S3_BUCKET_NAME__/project-athena-results/"
            - name: CACHE_REFRESH_HOUR
              value: "1"
            - name: AWS_DEFAULT_REGION
              value: "__AWS_REGION__"
            # NOTE: GRAFANA_URL은 SSM /robot-telemetry/grafana-url 에서 런타임 조회 (Late-binding)
            # 환경변수 주입은 fallback 용도 — post-deploy job이 SSM 갱신 후 자동 사용
            # Postgres (work_orders DB) 접속 — postgres svc DNS, secret 으로 인증.
            - name: POSTGRES_HOST
              value: "postgres.robot-telemetry.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: postgres-app-credentials  # POSTGRES_USER/PASSWORD/DB
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            # /healthz 만 BasicAuthMiddleware 면제 (src/api/main.py:107 _BASIC_AUTH_EXEMPT_PATHS).
            # path=/ 로 두면 401 받아 kubelet kill → CrashLoop → ALB 503 (회귀 9af8428).
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: robot-telemetry-api
  namespace: robot-telemetry
spec:
  type: ClusterIP
  selector:
    app: robot-telemetry-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
