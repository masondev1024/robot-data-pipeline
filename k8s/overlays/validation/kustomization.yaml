apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Short-lived, single-node validation profile. This intentionally avoids the
# API/Grafana ALBs and uses port-forward for smoke tests so the experiment does
# not create two additional hourly load balancers.
resources:
  - namespace.yaml
  - ../../robot-telemetry/postgres.yaml
  - ../../generator/statefulset.yaml
  - ../../generator/configmap.yaml
  - ../../api/configmap.yaml
  - ../../api/deployment.yaml
  - ../../monitoring/grafana-namespace.yaml
  - ../../monitoring/grafana-datasources.yaml
  - ../../monitoring/grafana-dashboard-provider.yaml
  - ../../monitoring/grafana-dashboards.yaml
  - ../../monitoring/grafana-deployment.yaml
  - ../../monitoring/adot/collector.yaml
  - ../../monitoring/adot/instrumentation.yaml

patches:
  - path: generator-validation-patch.yaml
  - path: generator-serviceaccount-patch.yaml
  - path: api-validation-patch.yaml
  - path: api-serviceaccount-patch.yaml
  - path: adot-serviceaccount-patch.yaml
  - path: grafana-serviceaccount-patch.yaml
