# In-cluster Postgres — Work Order 정비 큐 전용 DB.
#
# 채택 사유: DE-AI-Project-Group IAM policy 에 dynamodb 권한 없음 + RDS 는 비용 발생.
# 학습 단계 단일 stateful pod + EBS PVC 1Gi 면 충분. 클러스터 재생성 시 데이터 손실
# 가능하나 work_orders 는 운영 audit 용 — 학습 단계엔 영속성 우선순위 낮음.
#
# 시크릿 (POSTGRES_USER/PASSWORD/DB) 은 사람이 1회 수동 생성 (CLAUDE.md §1.C 패턴):
#   PG_PASS=$(openssl rand -base64 32 | tr -d '/+=' | head -c 24)
#   kubectl create secret generic postgres-app-credentials -n robot-telemetry \
#     --from-literal=POSTGRES_USER=app_user \
#     --from-literal=POSTGRES_PASSWORD=$PG_PASS \
#     --from-literal=POSTGRES_DB=robot_telemetry
#
# 초기 스키마는 ConfigMap (postgres-init-sql) 의 init.sql 이 첫 boot 시 자동 실행.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: robot-telemetry
data:
  01_work_orders.sql: |
    -- Work Order 정비 큐 — portal /work-orders CRUD 대상 테이블
    CREATE TABLE IF NOT EXISTS work_orders (
        work_order_id    UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        robot_id         VARCHAR(50)  NOT NULL,
        production_line  VARCHAR(20),
        station_type     VARCHAR(20),
        failure_type     VARCHAR(10),
        rul_days         INTEGER,
        hourly_loss_krw  INTEGER,
        priority_label   VARCHAR(20),
        status           VARCHAR(20)  NOT NULL DEFAULT 'pending'
                          CHECK (status IN ('pending','in_progress','done','cancelled')),
        assignee         VARCHAR(100),
        comments         TEXT,
        created_at       TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now(),
        updated_at       TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_work_orders_status     ON work_orders (status);
    CREATE INDEX IF NOT EXISTS idx_work_orders_robot      ON work_orders (robot_id);
    CREATE INDEX IF NOT EXISTS idx_work_orders_created_at ON work_orders (created_at DESC);

    -- updated_at 자동 갱신 trigger
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = now();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_work_orders_updated_at ON work_orders;
    CREATE TRIGGER trg_work_orders_updated_at
        BEFORE UPDATE ON work_orders
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: robot-telemetry
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  clusterIP: None  # headless — StatefulSet pattern

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: robot-telemetry
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-app-credentials
          env:
            # PGDATA subdir → mount 의 lost+found 충돌 회피
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
          requests:
            storage: 1Gi
