apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: CloudWatch
        uid: cloudwatch
        type: cloudwatch
        access: proxy
        isDefault: true
        jsonData:
          authType: default
          defaultRegion: __AWS_REGION__
      - name: Athena
        uid: athena
        type: grafana-athena-datasource
        access: proxy
        jsonData:
          authType: default
          defaultRegion: __AWS_REGION__
          catalog: AwsDataCatalog
          database: robot_telemetry_db
          workgroup: robot-telemetry-workgroup
      # X-Ray (Task 5.1) — ADOT Operator + Collector 배포 후 활성. Grafana
      # X-Ray plugin (grafana-x-ray-datasource) 가 별도 install 필요:
      # GF_INSTALL_PLUGINS=grafana-x-ray-datasource (k8s/monitoring/grafana-deployment.yaml)
      - name: X-Ray
        uid: xray
        type: grafana-x-ray-datasource
        access: proxy
        jsonData:
          authType: default
          defaultRegion: __AWS_REGION__
