              "datasource": {
                "type": "grafana-athena-datasource",
                "uid": "athena"
              },
              "format": 1,
              "rawSQL": "-- 최근 30분 silver_alerts 가장 많이 발생한 robot Top 10\n-- ADR-009 Flink 1분 tumbling Z-Score(σ>3) + 다변량 룰 결과\n-- §1.E: hour 파티션 프루닝(현재+직전 1시간) + window_end 30분 슬라이딩\nWITH recent AS (\n  SELECT robot_id,\n         COUNT(*) AS alert_count,\n         MAX(date_parse(window_end, '%Y-%m-%d %H:%i:%s')) AS last_at\n  FROM robot_telemetry_db.silver_alerts\n  WHERE (\n      (year = date_format(current_timestamp, '%Y') AND month = date_format(current_timestamp, '%m')\n       AND day = date_format(current_timestamp, '%d') AND hour = date_format(current_timestamp, '%H'))\n   OR (year = date_format(current_timestamp - INTERVAL '1' HOUR, '%Y') AND month = date_format(current_timestamp - INTERVAL '1' HOUR, '%m')\n       AND day = date_format(current_timestamp - INTERVAL '1' HOUR, '%d') AND hour = date_format(current_timestamp - INTERVAL '1' HOUR, '%H'))\n  )\n  AND date_parse(window_end, '%Y-%m-%d %H:%i:%s') > current_timestamp - INTERVAL '30' MINUTE\n  GROUP BY robot_id\n)\nSELECT\n  ROW_NUMBER() OVER (ORDER BY r.alert_count DESC) AS \"순위\",\n  r.robot_id                                       AS \"Robot\",\n  d.production_line || ' ' || d.station_type      AS \"Line·공정\",\n  r.alert_count                                    AS \"30분 알람\",\n  CASE\n    WHEN r.alert_count >= 15 THEN '임박'\n    WHEN r.alert_count >=  8 THEN '긴급'\n    WHEN r.alert_count >=  4 THEN '주의'\n    WHEN r.alert_count >=  2 THEN '관찰'\n    ELSE                          '양호'\n  END                                              AS \"위험도\",\n  date_format(r.last_at AT TIME ZONE 'Asia/Seoul', '%H:%i') AS \"최종\"\nFROM recent r\nJOIN robot_telemetry_db.dim_robot_line d ON r.robot_id = d.robot_id\nORDER BY r.alert_count DESC\nLIMIT 10",
              "refId": "A",
              "table": "silver_alerts"
            }
          ],
          "title": "지금 임계 초과 로봇 Top 10 — 즉시 대응 필요 (최근 30분)",
          "type": "table"
