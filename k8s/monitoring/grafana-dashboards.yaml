              "rawSQL": "SELECT\n  d.production_line                                                                AS \"라인\",\n  d.station_type                                                                   AS \"공정\",\n  COUNT(*)                                                                         AS \"총 로봇\",\n  SUM(CASE WHEN g.dominant_failure_type IS NULL OR g.dominant_failure_type='NONE' THEN 1 ELSE 0 END) AS \"정상\",\n  SUM(CASE WHEN g.dominant_failure_type IS NOT NULL AND g.dominant_failure_type<>'NONE' THEN 1 ELSE 0 END) AS \"AI 점검\",\n  ROUND(100.0 * SUM(CASE WHEN g.dominant_failure_type IS NOT NULL AND g.dominant_failure_type<>'NONE' THEN 1 ELSE 0 END) / COUNT(*), 1) AS \"위험율(%)\"\nFROM robot_telemetry_db.gold_robot_daily_stats g\nJOIN robot_telemetry_db.dim_robot_line d ON g.robot_id = d.robot_id\nWHERE g.dt = CAST(CAST(current_timestamp AT TIME ZONE 'Asia/Seoul' AS DATE) - INTERVAL '1' DAY AS DATE)\nGROUP BY 1, 2\nORDER BY 1",
              "refId": "A",
