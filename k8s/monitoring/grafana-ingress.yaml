apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # ALB healthcheck path 명시 — 미지정 시 default `/` 가 Grafana anonymous 설정 변경
    # (auth.anonymous.enabled=false) 만으로 302/401 응답 → ALB unhealthy 판정 → TargetGroup
    # 에서 빠지는 시한폭탄. K8s probe 와 동일하게 `/api/health` 로 통일.
    # Why: api-ingress.yaml 의 /healthz exempt 룰과 동일 패턴 (인증 면제 + 200 OK).
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
