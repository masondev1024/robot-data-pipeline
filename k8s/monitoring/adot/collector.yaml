---
# ADOT Collector ServiceAccount — IRSA annotation 으로 X-Ray 권한 부착.
# IAM role ARN 은 terraform/addons.tf 의 aws_iam_role.adot_collector 에서 생성.
# 운영 시 terraform output 'adot_collector_irsa_role_arn' 값으로 대체 필요.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-collector-sa
  namespace: opentelemetry-operator-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::__AWS_ACCOUNT_ID__:role/robot-telemetry-adot-collector-irsa
---
# OpenTelemetryCollector CR — ADOT Operator 가 관찰하여 Collector Deployment 자동 생성.
# OTLP receiver (gRPC 4317) → batch processor → AWS X-Ray exporter.
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: adot
  namespace: opentelemetry-operator-system
spec:
  mode: deployment
  serviceAccount: adot-collector-sa
  image: public.ecr.aws/aws-observability/aws-otel-collector:v0.48.0
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch/traces:
        timeout: 5s
        send_batch_size: 50

    exporters:
      awsxray:
        region: __AWS_REGION__

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch/traces]
          exporters: [awsxray]
