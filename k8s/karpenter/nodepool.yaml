apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
  namespace: karpenter
spec:
  # Template defines the nodes Karpenter will create
  template:
    spec:
      requirements:
        # On-demand instances (prefer cost-stability)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        # Instance types: t3 family (burstable, cost-effective)
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.large", "t3.xlarge", "t3a.large", "t3a.xlarge"]

        # Architecture: amd64 only
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        # Target Kubernetes version
        - key: kubernetes.io/version
          operator: Gt
          values: ["1.25"]

      nodeClassRef:
        name: default

      # Taints: Allow scheduling only when explicitly tolerated
      taints:
        - key: workload
          value: batch
          effect: NoSchedule

  # Limits define maximum resources Karpenter will provision
  limits:
    cpu: 100
    memory: 100Gi

  # Disruption budget: Allow controlled scale-down
  disruption:
    consolidateAfter: 30s
    expireAfter: 720h
    budgets:
      - nodes: "10%"
        duration: 5m
        schedule: "0 9 * * mon-fri"  # Weekdays 9am
        reasons:
          - "Underutilized"
          - "Empty"

---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
  namespace: karpenter
spec:
  amiFamily: AL2
  role: "robot-telemetry-karpenter-node-role"

  subnetSelector:
    karpenter.sh/discovery: "robot-telemetry-cluster"

  securityGroupSelector:
    karpenter.sh/discovery: "robot-telemetry-cluster"

  tags:
    Name: "robot-telemetry-karpenter-node"
    Environment: "dev"
    ManagedBy: "karpenter"

  # User data for initialization
  userData: |
    #!/bin/bash
    echo "Karpenter managed node initialized"

  # Monitoring and metrics
  detailedMonitoring: true

  # Block device mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
