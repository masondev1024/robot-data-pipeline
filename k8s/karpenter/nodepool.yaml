apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  # Template defines the nodes Karpenter will create for batch workloads
  template:
    spec:
      requirements:
        # On-demand instances (prefer cost-stability for batch jobs)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        # Instance types: t3 family (burstable, cost-effective)
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.large", "t3.xlarge", "t3a.large", "t3a.xlarge"]

        # Architecture: amd64 only
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

      nodeClassRef:
        name: default

      # Taints: Reserved for batch workloads (Airflow worker, etc.) — pods must tolerate
      taints:
        - key: workload
          value: batch
          effect: NoSchedule

  # Limits define maximum resources Karpenter will provision
  limits:
    cpu: 100
    memory: 100Gi

  # Disruption budget: Allow controlled scale-down + immediate Drifted replacement
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    expireAfter: 720h
    budgets:
      - nodes: "10%"
        duration: 5m
        schedule: "0 9 * * mon-fri"  # Weekdays 9am
        reasons:
          - "Underutilized"
          - "Empty"
      - nodes: "100%"
        reasons:
          - "Drifted"

---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: general
spec:
  # Template defines nodes for general (taintless) workloads — api, generator, etc.
  template:
    spec:
      requirements:
        # Spot preferred (cheapest); on-demand fallback when spot unavailable
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # Instance family diversity: compute (c5/c5a) + general (m5/m5a) + burstable (t3/t3a)
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c5", "c5a", "m5", "m5a", "t3", "t3a"]

        # Instance size: medium ~ xlarge (right-sized for demo workloads)
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge"]

        # AZ diversity: spread across all eu-west-1 zones for HA
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["eu-west-1a", "eu-west-1b", "eu-west-1c"]

        # Architecture: amd64 only
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

      nodeClassRef:
        name: default
      # No taints — general-purpose deployments (api, generator) schedule freely

  # Limits define maximum resources Karpenter will provision
  limits:
    cpu: 200
    memory: 200Gi

  # Disruption budget: Consolidate aggressively + immediate Drifted replacement
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    expireAfter: 720h
    budgets:
      - nodes: "20%"
        duration: 5m
      - nodes: "100%"
        reasons:
          - "Drifted"

---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
  namespace: karpenter
spec:
  amiFamily: AL2
  role: "robot-telemetry-karpenter-node-role"

  subnetSelector:
    karpenter.sh/discovery: "robot-telemetry-cluster"

  securityGroupSelector:
    karpenter.sh/discovery: "robot-telemetry-cluster"

  tags:
    Name: "robot-telemetry-karpenter-node"
    Environment: "dev"
    ManagedBy: "karpenter"

  # User data for initialization
  userData: |
    #!/bin/bash
    echo "Karpenter managed node initialized"

  # Monitoring and metrics
  detailedMonitoring: true

  # Block device mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
