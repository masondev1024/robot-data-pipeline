apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: robot-telemetry-generator-hpa
  namespace: robot-telemetry
  annotations:
    # 1단계 잠금 (min=max=10) 사유:
    #   POD_TOTAL_REPLICAS env 와 HPA replicas 동기화 reconciler 미구현.
    #   동적 replicas 시 모든 pod 이 robot ID range 재계산해야 하는데,
    #   env var 가 spec.template 에 박혀있어 HPA 가 replicas 만 바꿔도
    #   기존 pod 의 POD_TOTAL_REPLICAS 는 stale → robot ID range 충돌 위험.
    #
    # 2단계 (carry-over → docs/UPGRADE_ROADMAP.md):
    #   Downward API + RBAC 으로 generator-sa 가 StatefulSet read,
    #   pod 시작 시 spec.replicas 동적 조회. 그 후 minReplicas=5, maxReplicas=15,
    #   averageUtilization=60 으로 전환. variance 비용 절감 효과 살아남.
    robot-telemetry/phase: "1-locked-pending-reconciler"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: robot-telemetry-generator
  minReplicas: 10
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 잠금 상태에서 무의미하지만 2단계 전환 시 값 유지 — 그때 의미 있어짐.
          averageUtilization: 60
