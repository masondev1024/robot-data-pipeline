apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-telemetry-generator
  namespace: robot-telemetry
  labels:
    app: robot-telemetry-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-telemetry-generator
  template:
    metadata:
      labels:
        app: robot-telemetry-generator
    spec:
      serviceAccountName: generator-sa
      containers:
        - name: generator
          image: <ECR_URL>/robot-telemetry-generator:latest
          env:
            - name: ROBOT_COUNT
              value: "10000"
            - name: KINESIS_STREAM_NAME
              value: "robot-telemetry-stream"
            - name: KINESIS_ALERT_STREAM_NAME
              value: "robot-anomaly-alert-stream"
            - name: AWS_DEFAULT_REGION
              value: "ap-northeast-2"
            - name: SEED_CSV_PATH
              value: "/data/seed_data_sample.csv"
          volumeMounts:
            - name: seed-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: seed-data
          configMap:
            name: generator-seed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: generator-sa
  namespace: robot-telemetry
  annotations:
    eks.amazonaws.com/role-arn: <IRSA_ROLE_ARN_PLACEHOLDER>
    # 실제 ARN: terraform output -module=data_pipeline generator_irsa_role_arn
