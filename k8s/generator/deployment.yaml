apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-telemetry-generator
  namespace: robot-telemetry
  labels:
    app: robot-telemetry-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-telemetry-generator
  template:
    metadata:
      labels:
        app: robot-telemetry-generator
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      serviceAccountName: generator-sa
      containers:
        - name: generator
          image: 827913617635.dkr.ecr.eu-west-1.amazonaws.com/robot-telemetry-generator:latest
          env:
            # SIGUSR1 핸들러의 print() 가 즉시 stdout 으로 flush 되도록.
            # 미설정 시 block-buffering 으로 force_anomaly_triggered 로그가 buffer 에 갇혀
            # `kubectl logs --tail` 에 잡히지 않음 (verify run 25181144263 에서 발견).
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ROBOT_COUNT
              value: "100"
            - name: TICK_INTERVAL_SECONDS
              value: "5.0"
            - name: KINESIS_STREAM_NAME
              value: "robot-telemetry-stream"
            - name: KINESIS_ALERT_STREAM_NAME
              value: "robot-anomaly-alert-stream"
            - name: AWS_DEFAULT_REGION
              value: "eu-west-1"
            - name: SEED_CSV_PATH
              value: "/data/seed_data_sample.csv"
            # Fault episode 진입 확률 상향: 0.0002 → 0.005 (25x).
            # Why: 기본값은 100대 * 5s tick 환경에서 분당 0.24 episode 진입 → Flink WHERE
            # 절(z>3 OR motor_temp>=85)을 거의 못 채워 OverAggregate→Sink 0 records.
            # 0.005로 올리면 분당 6 episode → 알람 흐름 안정적 확인 가능.
            - name: FAULT_ENTRY_PROB
              value: "0.005"
          volumeMounts:
            - name: seed-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: seed-data
          configMap:
            name: generator-seed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: generator-sa
  namespace: robot-telemetry
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::827913617635:role/robot-telemetry-generator-irsa
