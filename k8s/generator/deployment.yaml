apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-telemetry-generator
  namespace: robot-telemetry
  labels:
    app: robot-telemetry-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-telemetry-generator
  template:
    metadata:
      labels:
        app: robot-telemetry-generator
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      serviceAccountName: generator-sa
      containers:
        - name: generator
          image: 827913617635.dkr.ecr.eu-west-1.amazonaws.com/robot-telemetry-generator:latest
          env:
            # SIGUSR1 핸들러의 print() 가 즉시 stdout 으로 flush 되도록.
            # 미설정 시 block-buffering 으로 force_anomaly_triggered 로그가 buffer 에 갇혀
            # `kubectl logs --tail` 에 잡히지 않음 (verify run 25181144263 에서 발견).
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ROBOT_COUNT
              value: "100"
            - name: TICK_INTERVAL_SECONDS
              value: "2.0"
            - name: KINESIS_STREAM_NAME
              value: "robot-telemetry-stream"
            - name: KINESIS_ALERT_STREAM_NAME
              value: "robot-anomaly-alert-stream"
            - name: AWS_DEFAULT_REGION
              value: "eu-west-1"
            - name: SEED_CSV_PATH
              value: "/data/seed_data_sample.csv"
            # Fault episode 진입 확률: 0.0002 (default) → 0.0005 (2.5x).
            # Why: 100대 * 2s tick * fault duration 180s 기준 ground truth P(fault) 산식
            #   P = entry_rate/s × duration / (1 + entry_rate/s × duration)
            #   0.005 → P ≈ 31% (ground truth 자체가 이미 31% 라 Flink strict threshold
            #     걸어도 6분 sliding distinct ~30-40% 로 떠 portal "21/100" 같은 과탐 발생)
            #   0.0005 → P ≈ 4.3% (목표 3-5% detection 정합)
            # 분당 episode = 100 * 30 tick/min * 0.0005 = 1.5 episode/min
            # 더 낮추면 (0.0002 default) 분당 0.6 episode 로 Flink Sink "0 records" 회귀 위험.
            - name: FAULT_ENTRY_PROB
              value: "0.0005"
          volumeMounts:
            - name: seed-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: seed-data
          configMap:
            name: generator-seed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: generator-sa
  namespace: robot-telemetry
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::827913617635:role/robot-telemetry-generator-irsa
