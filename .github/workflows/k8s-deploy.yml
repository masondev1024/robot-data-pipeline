name: k8s-deploy

on:
  # 비용 셧다운 운영 모델: cluster 가 down 일 때 push trigger 가 매번 fail 누적
  # (예: OpenTelemetry Operator 다운 → conversion webhook endpoint 없음 → exit 1).
  # 재개 시 up.sh 후 GitHub UI Actions 탭에서 "Run workflow" 로 수동 실행.
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'robot-telemetry-cluster' }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve and validate deployment coordinates
        run: |
          test -n "$EXPECTED_AWS_ACCOUNT_ID" || { echo "AWS_ACCOUNT_ID repository variable is required"; exit 1; }
          test -n "$S3_BUCKET_NAME" || { echo "S3_BUCKET_NAME repository variable is required"; exit 1; }
          bash scripts/require_aws_account.sh
          echo "AWS_ACCOUNT_ID=$EXPECTED_AWS_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Render account-neutral deployment templates
        run: python3 scripts/render_deployment.py --output /tmp/robot-deploy

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Generator image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          if [ -f src/generator/Dockerfile ]; then
            docker build -t $ECR_REGISTRY/robot-telemetry-generator:$IMAGE_TAG -f src/generator/Dockerfile .
            docker push $ECR_REGISTRY/robot-telemetry-generator:$IMAGE_TAG
          fi

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          if [ -f src/api/Dockerfile ]; then
            docker build -t $ECR_REGISTRY/robot-telemetry-api:$IMAGE_TAG -f src/api/Dockerfile .
            docker push $ECR_REGISTRY/robot-telemetry-api:$IMAGE_TAG
          fi

      - name: Build Lambda ZIP
        run: |
          if [ -f src/lambda/alert_handler.py ]; then
            mkdir -p src/lambda/dist
            if [ -f src/lambda/requirements.txt ]; then
              pip install -r src/lambda/requirements.txt -t src/lambda/dist/ --quiet
            fi
            cp src/lambda/alert_handler.py src/lambda/dist/
            cd src/lambda && zip -r alert_handler.zip dist/ -x "*.pyc" -x "*/__pycache__/*"
            echo "Lambda ZIP built: $(du -sh alert_handler.zip | cut -f1)"
          fi

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply Kubernetes manifests
        run: |
          if [ -d /tmp/robot-deploy/k8s ] && [ "$(ls -A /tmp/robot-deploy/k8s)" ]; then
            kubectl apply -f /tmp/robot-deploy/k8s --recursive
          fi

      - name: Verify workload rollouts
        run: |
          kubectl rollout status statefulset/robot-telemetry-generator -n robot-telemetry --timeout=300s
          kubectl rollout status deployment/robot-telemetry-api -n robot-telemetry --timeout=300s
