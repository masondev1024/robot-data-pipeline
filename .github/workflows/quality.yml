name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install quality environment
        run: pip install -r requirements-dev.lock
      - name: Reject critical Python errors
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Render account-neutral deployment templates
        env:
          AWS_ACCOUNT_ID: "123456789012"
          AWS_REGION: eu-west-1
          EKS_CLUSTER_NAME: robot-telemetry-cluster
          S3_BUCKET_NAME: robot-platform-ci-example
          IMAGE_TAG: 0123456789abcdef0123456789abcdef01234567
        run: python3 scripts/render_deployment.py --output /tmp/robot-deploy
      - name: Run deterministic core tests
        env:
          AIRFLOW_HOME: /tmp/robot-data-pipeline-airflow
          PYTHONHASHSEED: "2026"
        run: pytest -q --ignore=tests/etl -m "not slow"

  airflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install production-compatible Airflow test environment
        run: >-
          pip install
          apache-airflow==2.10.5
          boto3==1.36.3
          pytest==8.3.4
          --constraint
          https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt
      - name: Verify Airflow DAG and boundary contracts
        env:
          AIRFLOW_HOME: /tmp/robot-airflow-home
          PYTHONHASHSEED: "2026"
        run: pytest -q tests/etl

  terraform-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize without remote state
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate
      - name: Initialize validation profile without remote state
        run: terraform -chdir=terraform/validation init -backend=false -input=false
      - name: Validate validation profile
        run: terraform -chdir=terraform/validation validate

  prism-public-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build public PRISM application image
        run: >-
          docker build
          --build-arg PUBLIC_STREAMLIT_CONFIG=true
          --file prism/Dockerfile.app
          --tag prism-public-operator:ci
          .
      - name: Build public PRISM reverse-proxy image
        run: docker build --file prism/Dockerfile.caddy --tag prism-public-caddy:ci .
      - name: Validate public PRISM Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dotenv_file="$(mktemp)"
          chmod 600 "$dotenv_file"
          trap 'rm -f "$dotenv_file"' EXIT
          dummy_bcrypt_hash="$(
            docker run --rm --entrypoint caddy prism-public-caddy:ci \
              hash-password --plaintext ci-placeholder-password
          )"
          {
            printf '%s\n' 'PRISM_PUBLIC_OPERATOR_IMAGE=prism-public-operator:ci'
            printf '%s\n' 'PRISM_PUBLIC_CADDY_IMAGE=prism-public-caddy:ci'
            printf '%s\n' 'PUBLIC_DOMAIN=ci.example.invalid'
            printf '%s\n' 'CADDY_ACME_EMAIL=ci@example.invalid'
            printf '%s\n' 'CADDY_BASIC_AUTH_USER=ci'
            printf "CADDY_BASIC_AUTH_HASH='%s'\n" "$dummy_bcrypt_hash"
          } > "$dotenv_file"
          docker compose --env-file "$dotenv_file" -f prism/docker-compose.public.yml config --quiet
          docker compose --env-file "$dotenv_file" -f prism/docker-compose.public.yml run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
