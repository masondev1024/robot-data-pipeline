name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install quality environment
        run: pip install -r requirements-dev.lock
      - name: Reject critical Python errors
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Run deterministic core tests
        env:
          AIRFLOW_HOME: /tmp/robot-data-pipeline-airflow
          PYTHONHASHSEED: "2026"
        run: pytest -q --ignore=tests/etl -m "not slow"

  airflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install production-compatible Airflow test environment
        run: >-
          pip install
          apache-airflow==2.10.5
          boto3==1.36.3
          pytest==8.3.4
          --constraint
          https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt
      - name: Verify offline Bedrock report contract
        env:
          AIRFLOW_HOME: /tmp/robot-airflow-home
          PYTHONHASHSEED: "2026"
        run: pytest -q tests/etl/test_bedrock_report.py

  terraform-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize without remote state
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate
