name: post-deploy

on:
  workflow_run:
    workflows: ["k8s-deploy"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  store-dns:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name robot-telemetry-cluster --region eu-west-1

      - name: Wait for API ALB DNS
        id: api-dns
        run: |
          DNS=""
          for i in $(seq 1 20); do
            DNS=$(kubectl get ingress robot-telemetry-api-ingress \
              -n robot-telemetry \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$DNS" ] && [ "$DNS" != "null" ]; then
              echo "dns=$DNS" >> $GITHUB_OUTPUT
              echo "API ALB DNS 확정: $DNS"
              break
            fi
            echo "[$i/20] API ALB 대기 중... (15초)"
            sleep 15
          done
          if [ -z "$DNS" ]; then
            echo "API ALB DNS 확정 실패 (300초 초과)"
            exit 1
          fi

      - name: Wait for Grafana ALB DNS
        id: grafana-dns
        run: |
          DNS=""
          for i in $(seq 1 20); do
            DNS=$(kubectl get ingress grafana-ingress \
              -n monitoring \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$DNS" ] && [ "$DNS" != "null" ]; then
              echo "dns=$DNS" >> $GITHUB_OUTPUT
              echo "Grafana ALB DNS 확정: $DNS"
              break
            fi
            echo "[$i/20] Grafana ALB 대기 중... (15초)"
            sleep 15
          done
          if [ -z "$DNS" ]; then
            echo "Grafana ALB DNS 확정 실패 (300초 초과)"
            exit 1
          fi

      - name: Wait for Airflow ALB DNS (best-effort)
        id: airflow-dns
        continue-on-error: true
        run: |
          # Airflow 는 helm install 단계에서 생성됨. k8s-deploy 와 시점이 어긋날 수
          # 있으므로 best-effort: 60초 대기 후 못 찾으면 SSM 갱신 skip.
          DNS=""
          ING=$(kubectl get ingress -n airflow -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -z "$ING" ]; then
            echo "Airflow ingress 미발견 (helm 미설치 or ingress.web.enabled=false). skip."
            exit 0
          fi
          for i in $(seq 1 4); do
            DNS=$(kubectl get ingress "$ING" -n airflow \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$DNS" ] && [ "$DNS" != "null" ]; then
              echo "dns=$DNS" >> $GITHUB_OUTPUT
              echo "Airflow ALB DNS 확정: $DNS"
              break
            fi
            echo "[$i/4] Airflow ALB 대기 중... (15초)"
            sleep 15
          done

      - name: Store DNS values to SSM
        run: |
          aws ssm put-parameter \
            --name "/robot-telemetry/portal-url" \
            --value "http://${{ steps.api-dns.outputs.dns }}" \
            --type String \
            --overwrite
          aws ssm put-parameter \
            --name "/robot-telemetry/grafana-url" \
            --value "http://${{ steps.grafana-dns.outputs.dns }}" \
            --type String \
            --overwrite
          echo "SSM 저장 완료:"
          echo "  /robot-telemetry/portal-url = http://${{ steps.api-dns.outputs.dns }}"
          echo "  /robot-telemetry/grafana-url = http://${{ steps.grafana-dns.outputs.dns }}"
          AIRFLOW_DNS="${{ steps.airflow-dns.outputs.dns }}"
          if [ -n "$AIRFLOW_DNS" ]; then
            aws ssm put-parameter \
              --name "/robot-telemetry/airflow-url" \
              --value "http://$AIRFLOW_DNS" \
              --type String \
              --overwrite
            echo "  /robot-telemetry/airflow-url = http://$AIRFLOW_DNS"
          fi

      # Grafana SPA bootstrap URL 을 새 ALB DNS 로 주입 (deployment 매니페스트에는 박지 않음 — 클러스터 재생성 시 DNS 가 바뀌므로)
      - name: Patch Grafana GF_SERVER_ROOT_URL
        run: |
          ROOT_URL="http://${{ steps.grafana-dns.outputs.dns }}/"
          kubectl set env deployment/grafana -n monitoring \
            "GF_SERVER_ROOT_URL=$ROOT_URL"
          kubectl rollout status deployment/grafana -n monitoring --timeout=180s
          echo "Grafana GF_SERVER_ROOT_URL = $ROOT_URL"

      # CloudWatch dashboard 패널의 LoadBalancer dimension 을 새 API ALB ARN suffix 로 치환
      - name: Patch Grafana dashboards LoadBalancer ARN
        run: |
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?DNSName=='${{ steps.api-dns.outputs.dns }}'].LoadBalancerArn" \
            --output text)
          if [ -z "$ALB_ARN" ]; then
            echo "ALB ARN 추출 실패 — DNS=${{ steps.api-dns.outputs.dns }}"
            exit 1
          fi
          # ARN 형식: arn:aws:elasticloadbalancing:region:acct:loadbalancer/app/<name>/<suffix>
          ARN_SUFFIX=$(echo "$ALB_ARN" | sed -E 's|^.*loadbalancer/||')
          echo "API ALB ARN suffix = $ARN_SUFFIX"

          # ConfigMap 의 dashboard JSON 에서 placeholder 치환 + apply + grafana 재시작
          sed "s|__API_ALB_ARN_SUFFIX__|${ARN_SUFFIX}|g" \
            k8s/monitoring/grafana-dashboards.yaml > /tmp/grafana-dashboards.rendered.yaml
          kubectl apply -f /tmp/grafana-dashboards.rendered.yaml
          kubectl rollout restart deployment/grafana -n monitoring
          kubectl rollout status deployment/grafana -n monitoring --timeout=180s
