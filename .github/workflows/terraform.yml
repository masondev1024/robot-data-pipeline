name: terraform

on:
  # apply 는 backend(S3) 설정이 없어 GitHub Actions runner state 가 매번 비어있음
  # → 이미 존재하는 리소스 재생성 시도로 매 push fail. 로컬에서 직접 terraform
  # apply 하는 현재 운영 모델에 맞춰 push trigger 제거. 정말 필요할 때만 수동 실행.
  workflow_dispatch: {}
  pull_request:
    paths: ['terraform/**']

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Terraform Init
        run: terraform init
        working-directory: terraform/
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1
        working-directory: terraform/
        continue-on-error: true
        env:
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Post Plan Comment
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## Terraform Plan 결과\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n*Triggered by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - run: terraform init
        working-directory: terraform/
      - run: terraform apply -auto-approve
        working-directory: terraform/
        env:
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
