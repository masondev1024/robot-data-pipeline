name: terraform-static

# Remote state bootstrap 전에는 AWS plan/apply를 실행하지 않는다.
# 빈 runner state로 plan/apply하면 기존 리소스를 전부 신규 생성 대상으로 오판한다.
on:
  pull_request:
    paths: ['terraform/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize without remote state
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate
      - name: Initialize validation profile without remote state
        run: terraform -chdir=terraform/validation init -backend=false -input=false
      - name: Validate validation profile
        run: terraform -chdir=terraform/validation validate
