name: phase8-e2e-verify

# Phase 8 (Multi-class PdM) E2E 시연 검증.
# - workflow_dispatch: 수동 트리거 (언제든)
# - schedule: 2026-05-03 01:00 UTC (= KST 10:00) — 매년 같은 날 반복되지만 검증 끝나면
#   schedule 트리거 블록 제거하거나 workflow disable 하면 됨.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 3 5 *"

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: eu-west-1
      ECR_REPO: robot-telemetry-generator
      EKS_CLUSTER: robot-telemetry-cluster
      K8S_NS: robot-telemetry
      ATHENA_DB: robot_telemetry_db
      ATHENA_WG: robot-telemetry-workgroup
      ATHENA_OUTPUT: s3://de-ai-06-smartfactory-bucket/project-athena-results/
      # 임계 commit (Phase 8). 이 시각 이후 push 된 이미지면 fresh.
      # 2026-05-01 02:13 KST = 2026-04-30T17:13:00Z UTC.
      MIN_PUSH_AT: "2026-04-30T17:13:00Z"

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: 1. ECR latest image push 시각 확인
        id: ecr_check
        run: |
          PUSHED_AT=$(aws ecr describe-images --repository-name "$ECR_REPO" --region "$AWS_REGION" --query 'sort_by(imageDetails,&imagePushedAt)[-1].imagePushedAt' --output text)
          echo "ECR latest push: $PUSHED_AT"
          echo "pushed_at=$PUSHED_AT" >> "$GITHUB_OUTPUT"
          PUSHED_TS=$(date -u -d "$PUSHED_AT" +%s)
          MIN_TS=$(date -u -d "$MIN_PUSH_AT" +%s)
          if [ "$PUSHED_TS" -lt "$MIN_TS" ]; then
            echo "::warning::ECR image stale (pushed $PUSHED_AT < $MIN_PUSH_AT)"
            echo "ecr_status=STALE" >> "$GITHUB_OUTPUT"
          else
            echo "ecr_status=FRESH" >> "$GITHUB_OUTPUT"
          fi

      - name: 2. Generator pod SIGUSR1 + failure_type 송출 확인
        id: gen_check
        run: |
          set +e
          IMAGE=$(kubectl -n "$K8S_NS" get deploy/robot-telemetry-generator -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)
          if [ -z "$IMAGE" ]; then
            echo "deployment 없음"
            echo "gen_status=MISSING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Generator image: $IMAGE"
          POD=$(kubectl -n "$K8S_NS" get pod -l app=robot-telemetry-generator -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -z "$POD" ]; then
            echo "pod 없음"
            echo "gen_status=NO_POD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # python:3.11-slim 에 procps 미설치 → kill 바이너리 없음. python 인터프리터로 SIGUSR1 직접 전달.
          kubectl -n "$K8S_NS" exec "$POD" -- python -c "import os, signal; os.kill(1, signal.SIGUSR1)" || true
          sleep 60
          LOG=$(kubectl -n "$K8S_NS" logs "$POD" --tail=200 2>/dev/null)
          TRIGGERED=$(echo "$LOG" | grep -c 'force_anomaly_triggered' || true)
          FT_FOUND=$(echo "$LOG" | grep -c 'failure_type' || true)
          echo "force_anomaly_triggered events: $TRIGGERED"
          echo "failure_type log mentions: $FT_FOUND"
          echo "triggered=$TRIGGERED" >> "$GITHUB_OUTPUT"
          echo "ft_found=$FT_FOUND" >> "$GITHUB_OUTPUT"
          # PASS 조건은 SIGUSR1 핸들러 발화(=trigger 1건 이상). failure_type 텍스트는
          # generator happy-path 에선 stdout 에 안 찍힘 (record 는 Kinesis 로만 송출). 실제
          # 송출 검증은 step 3 (Bronze 적재)가 담당.
          if [ "$TRIGGERED" -ge 1 ]; then
            echo "gen_status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "gen_status=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. Bronze 파티션에 failure_type 적재 확인 (Athena)
        id: bronze_check
        run: |
          set +e
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          HOUR=$(date -u +%H)
          QUERY="SELECT failure_type, COUNT(*) AS cnt FROM bronze_robot_telemetry WHERE year='$YEAR' AND month='$MONTH' AND day='$DAY' AND hour='$HOUR' GROUP BY failure_type"
          echo "Athena query: $QUERY"
          EXEC_ID=$(aws athena start-query-execution --query-string "$QUERY" --query-execution-context "Database=$ATHENA_DB" --work-group "$ATHENA_WG" --result-configuration "OutputLocation=$ATHENA_OUTPUT" --region "$AWS_REGION" --query 'QueryExecutionId' --output text 2>&1)
          echo "Athena exec id (or error): '$EXEC_ID'"
          if [ -z "$EXEC_ID" ] || echo "$EXEC_ID" | grep -qi "error\|exception\|denied"; then
            echo "bronze_status=START_FAIL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATE=UNKNOWN
          for i in $(seq 1 30); do
            STATE=$(aws athena get-query-execution --query-execution-id "$EXEC_ID" --region "$AWS_REGION" --query 'QueryExecution.Status.State' --output text)
            if [ "$STATE" = "SUCCEEDED" ] || [ "$STATE" = "FAILED" ] || [ "$STATE" = "CANCELLED" ]; then break; fi
            sleep 2
          done
          echo "Athena state: $STATE"
          if [ "$STATE" != "SUCCEEDED" ]; then
            echo "bronze_status=ATHENA_FAIL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws athena get-query-results --query-execution-id "$EXEC_ID" --region "$AWS_REGION" --output json > /tmp/bronze_result.json
          NON_NONE=$(python3 -c "import json; d=json.load(open('/tmp/bronze_result.json')); rows=d.get('ResultSet',{}).get('Rows',[])[1:]; print(sum(int(r['Data'][1].get('VarCharValue','0')) for r in rows if r['Data'][0].get('VarCharValue','NONE') not in ('NONE','')))")
          echo "Non-NONE failure_type rows: $NON_NONE"
          echo "non_none=$NON_NONE" >> "$GITHUB_OUTPUT"
          if [ "$NON_NONE" -ge 1 ]; then
            echo "bronze_status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "bronze_status=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: 4. /api/predict 응답 schema 검증
        id: api_check
        run: |
          set +e
          ALB=$(kubectl -n "$K8S_NS" get ingress robot-telemetry-api-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          if [ -z "$ALB" ]; then
            echo "ingress 없음"
            echo "api_status=NO_INGRESS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "API ALB: $ALB"
          curl -sS -o /tmp/predict_body.json -w "%{http_code}" -X POST "http://$ALB/api/predict" -H "Content-Type: application/json" -d '{"robot_id":"ROBOT-00001","avg_motor_temp":92.0,"max_motor_temp":98.0,"battery_drain":30,"active_hours":8,"max_temp_load_ratio":3.1}' > /tmp/predict_status.txt
          STATUS=$(cat /tmp/predict_status.txt)
          echo "HTTP status: $STATUS"
          echo "Body:"
          cat /tmp/predict_body.json
          echo
          if [ "$STATUS" != "200" ]; then
            echo "api_status=HTTP_$STATUS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MISSING=$(python3 -c "import json; b=json.load(open('/tmp/predict_body.json')); req=['failure_distribution','predicted_failure_type','fault_probability','risk_level','recommended_action']; m=[k for k in req if k not in b]; v={'NONE','TWF','HDF','PWF','OSF','RNF'}; pft=b.get('predicted_failure_type'); m.append('invalid_pred='+str(pft)) if (pft is not None and pft not in v) else None; print(','.join(m) if m else 'OK')")
          echo "Missing/invalid: $MISSING"
          PREDICTED=$(python3 -c "import json; print(json.load(open('/tmp/predict_body.json')).get('predicted_failure_type','?'))")
          echo "predicted=$PREDICTED" >> "$GITHUB_OUTPUT"
          if [ "$MISSING" = "OK" ]; then
            echo "api_status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "api_status=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: 5. 결과 리포트 (Step Summary)
        if: always()
        env:
          ECR_PUSHED: ${{ steps.ecr_check.outputs.pushed_at }}
          ECR_STATUS: ${{ steps.ecr_check.outputs.ecr_status }}
          GEN_STATUS: ${{ steps.gen_check.outputs.gen_status }}
          GEN_TRIGGERED: ${{ steps.gen_check.outputs.triggered }}
          GEN_FT: ${{ steps.gen_check.outputs.ft_found }}
          BRONZE_STATUS: ${{ steps.bronze_check.outputs.bronze_status }}
          BRONZE_NON_NONE: ${{ steps.bronze_check.outputs.non_none }}
          API_STATUS: ${{ steps.api_check.outputs.api_status }}
          API_PRED: ${{ steps.api_check.outputs.predicted }}
        run: |
          {
            echo "# Phase 8 E2E 검증 결과"
            echo ""
            echo "| 항목 | 상태 | 증거 |"
            echo "|---|---|---|"
            echo "| 1. ECR generator latest push | $ECR_STATUS | $ECR_PUSHED |"
            echo "| 2. Generator force_anomaly + failure_type 로그 | $GEN_STATUS | trigger=$GEN_TRIGGERED, ft=$GEN_FT |"
            echo "| 3. Bronze 파티션 failure_type 적재 | $BRONZE_STATUS | non_NONE=$BRONZE_NON_NONE |"
            echo "| 4. /api/predict multi-class 응답 | $API_STATUS | predicted=$API_PRED |"
            echo ""
            echo "## 다음 액션"
            if [ "$ECR_STATUS" = "STALE" ]; then echo "- **ECR stale**: k8s-deploy workflow 마지막 run 상태 확인."; fi
            if [ "$GEN_STATUS" != "PASS" ]; then echo "- **Generator FAIL**: kubectl -n $K8S_NS logs deploy/robot-telemetry-generator --tail=500"; fi
            if [ "$BRONZE_STATUS" != "PASS" ]; then echo "- **Bronze FAIL**: Firehose buffer flush 지연(최대 5분) 가능 — 재시도."; fi
            if [ "$API_STATUS" != "PASS" ]; then echo "- **API FAIL**: SageMaker endpoint 가 옛 binary 모델 — 'python3 -m src.ml.train' 수동 실행 또는 Airflow retrain_ml_model task 트리거."; fi
          } >> "$GITHUB_STEP_SUMMARY"
