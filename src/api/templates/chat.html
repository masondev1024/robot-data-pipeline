<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Telemetry AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; display: flex; flex-direction: column; min-height: 100vh; }
  header { background: #1a1a2e; color: #e0e0ff; padding: 16px 24px; }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  header p { font-size: 0.75rem; color: #888; margin-top: 4px; }
  #cached-at { font-size: 0.7rem; color: #aaa; margin-top: 2px; }
  #chat-container { flex: 1; overflow-y: auto; padding: 24px; max-width: 800px; width: 100%; margin: 0 auto; }
  .message { margin-bottom: 16px; display: flex; flex-direction: column; }
  .message.user { align-items: flex-end; }
  .message.assistant { align-items: flex-start; }
  .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
  .message.user .bubble { background: #4f6ef7; color: white; border-bottom-right-radius: 4px; }
  .message.assistant .bubble { background: white; color: #222; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .label { font-size: 0.7rem; color: #888; margin-bottom: 4px; padding: 0 4px; }
  #input-bar { background: white; border-top: 1px solid #e0e0e0; padding: 16px 24px; }
  #input-wrap { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
  #question { flex: 1; padding: 10px 14px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 0.9rem; outline: none; resize: none; height: 44px; }
  #question:focus { border-color: #4f6ef7; }
  #send-btn { padding: 10px 20px; background: #4f6ef7; color: white; border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
  #send-btn:disabled { background: #a0a0c0; cursor: not-allowed; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #4f6ef7; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Robot Telemetry AI 정비 분석</h1>
  <p>Gold 테이블 데이터 기반 자연어 질의응답</p>
  <div id="cached-at">캐시 갱신: 로딩 중...</div>
</header>
<div id="chat-container"></div>
<div id="input-bar">
  <div id="input-wrap">
    <textarea id="question" placeholder="예: 오늘 점검이 가장 시급한 로봇은?" rows="1"></textarea>
    <button id="send-btn">전송</button>
  </div>
</div>
<script>
  const chatContainer = document.getElementById("chat-container");
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("send-btn");
  const cachedAtEl = document.getElementById("cached-at");

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "나" : "AI";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    div.appendChild(label);
    div.appendChild(bubble);
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return bubble;
  }

  async function sendQuestion() {
    const question = questionEl.value.trim();
    if (!question) return;
    questionEl.value = "";
    sendBtn.disabled = true;
    appendMessage("user", question);

    const thinkingBubble = appendMessage("assistant", "");
    const spinner = document.createElement("div");
    spinner.className = "spinner";
    thinkingBubble.appendChild(spinner);

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) {
        thinkingBubble.textContent = `오류: ${data.detail || res.statusText}`;
      } else {
        thinkingBubble.textContent = data.answer;
        if (data.cached_at) {
          cachedAtEl.textContent = `캐시 갱신: ${new Date(data.cached_at).toLocaleString("ko-KR")}`;
        }
      }
    } catch (err) {
      thinkingBubble.textContent = `네트워크 오류: ${err.message}`;
    } finally {
      sendBtn.disabled = false;
      questionEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendQuestion);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  });
</script>
</body>
</html>
