<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Telemetry Portal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1976d2;
            --primary-dark: #1565c0;
            --primary-light: #e3f2fd;
            --bg: #eef2f7;
            --surface: #ffffff;
            --border: #dde3ec;
            --text: #1a1a1a;
            --text-secondary: #5a6271;
            --user-bg: linear-gradient(135deg, #1976d2, #1e88e5);
            --assistant-bg: #f3f6fa;
            --robot-card-bg: linear-gradient(135deg, #fff8e1, #ffecb3);
            --robot-card-border: #ffb300;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }
        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }
        .header-title:hover { opacity: 0.8; }
        .header-title::before {
            content: "🤖";
            font-size: 22px;
        }
        .header-info { font-size: 13px; color: var(--text-secondary); }
        .dashboard-tabs { display: flex; gap: 6px; margin-left: auto; }
        .dashboard-tab {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.15s;
        }
        .dashboard-tab:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
        .dashboard-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            padding: 16px;
            height: calc(100vh - 64px);
        }
        .grafana-section {
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            position: relative;
        }
        #grafana-frame { width: 100%; height: 100%; border: none; display: block; }
        .iframe-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
            color: var(--text-secondary);
            font-size: 13px;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 1;
        }
        .iframe-placeholder.hidden { opacity: 0; }
        .iframe-placeholder.error { background: #fff8f6; color: #c62828; pointer-events: auto; }
        .iframe-placeholder .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #d6dde7;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .iframe-placeholder.error .spinner { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .chat-section {
            background: var(--surface);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        .chat-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(180deg, var(--surface) 0%, #fafbfc 100%);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header::before { content: "💬"; font-size: 18px; }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #c9d1de; border-radius: 3px; }
        .message {
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.55;
            max-width: 92%;
            animation: slideIn 0.25s ease-out;
            word-wrap: break-word;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .message.user {
            background: var(--user-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm);
        }
        .message.assistant {
            background: var(--assistant-bg);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.assistant .md-content { font-size: 13.5px; }
        .message.assistant .md-content p { margin: 0 0 6px; }
        .message.assistant .md-content p:last-child { margin-bottom: 0; }
        .message.assistant .md-content code {
            background: #e7ebf2;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 12.5px;
            font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
        }
        .message.assistant .md-content strong { color: var(--primary-dark); font-weight: 600; }
        .message.assistant .md-content ul,
        .message.assistant .md-content ol { padding-left: 22px; margin: 4px 0; }
        .message.assistant .md-content li { margin: 2px 0; }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #d0d7e2;
        }
        .link-button {
            padding: 10px 12px;
            background: var(--robot-card-bg);
            border: 1px solid var(--robot-card-border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.18s;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #6d4c00;
        }
        .link-button::before { content: "📊"; font-size: 16px; }
        .link-button:hover {
            background: linear-gradient(135deg, #ffe082, #ffca28);
            transform: translateX(2px);
            box-shadow: 0 2px 4px rgba(255,179,0,0.25);
        }
        .link-button:active { transform: translateX(1px) scale(0.99); }
        .chat-input-area {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            background: #fafbfc;
        }
        .chat-input-area input {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 22px;
            font-size: 13px;
            background: var(--surface);
            transition: all 0.15s;
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(25,118,210,0.12);
        }
        .chat-input-area button {
            padding: 10px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            min-height: 44px;
            transition: all 0.15s;
        }
        .chat-input-area button:hover { background: var(--primary-dark); }
        .chat-input-area button:active { transform: scale(0.97); }
        .chat-input-area button:disabled { background: #b0bcca; cursor: not-allowed; }
        .typing {
            display: none;
            align-self: flex-start;
            margin: 0 16px 0;
            padding: 10px 14px;
            background: var(--assistant-bg);
            border-radius: 14px;
            gap: 4px;
            align-items: center;
        }
        .typing.show { display: flex; }
        .typing .dot {
            width: 7px;
            height: 7px;
            background: #98a3b3;
            border-radius: 50%;
            animation: typingBounce 1.2s infinite;
        }
        .typing .dot:nth-child(2) { animation-delay: 0.15s; }
        .typing .dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-5px); opacity: 1; }
        }
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px 16px;
            font-size: 13px;
            line-height: 1.6;
        }
        .empty-state .icon { font-size: 32px; margin-bottom: 8px; }
        .empty-state .examples {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .empty-state .example {
            padding: 8px 12px;
            background: var(--primary-light);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12.5px;
            color: var(--primary-dark);
            transition: all 0.15s;
        }
        .empty-state .example:hover { background: #c5dafc; }

        /* Task 8.4: 예측 점검 패널 */
        .predict-section {
            background: var(--surface);
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .predict-header {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }
        .predict-header::before { content: "🔮"; }
        .predict-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 6px;
            margin-bottom: 8px;
        }
        .predict-form label {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
            min-width: 0;
        }
        .predict-form label .lbl-text { display: flex; justify-content: space-between; gap: 6px; }
        .predict-form label .hint { font-size: 10.5px; color: #98a3b3; font-weight: 400; }
        .predict-form input {
            padding: 7px 9px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            min-width: 0;
            color: var(--text);
        }
        .predict-form input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(25,118,210,0.10); }
        .predict-form input[readonly] { background: #f3f6fa; color: var(--text-secondary); }
        .predict-form .full { grid-column: 1 / -1; }
        .predict-actions { display: flex; gap: 6px; }
        .autofill-btn {
            flex: 0 0 auto;
            padding: 8px 12px;
            background: #fff;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            min-height: 36px;
            transition: all 0.15s;
        }
        .autofill-btn:hover { background: var(--primary-light); }
        .autofill-btn:disabled { color: #98a3b3; border-color: #c9d1de; cursor: not-allowed; }
        .autofill-btn::before { content: "🤖 "; }
        .ft-legend {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #d0d7e2;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            font-size: 10.5px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .ft-legend .item { display: inline-flex; align-items: center; gap: 4px; }
        .predict-btn {
            width: 100%;
            padding: 8px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            min-height: 36px;
        }
        .predict-btn:hover { background: var(--primary-dark); }
        .predict-btn:disabled { background: #b0bcca; cursor: not-allowed; }
        .predict-result {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            line-height: 1.5;
            display: none;
        }
        .predict-result.show { display: block; }
        .ft-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 700;
            color: white;
            margin-right: 6px;
        }
        .ft-NONE { background: #4caf50; }
        .ft-HDF  { background: #e53935; }
        .ft-PWF  { background: #fb8c00; }
        .ft-OSF  { background: #fdd835; color: #5a4500; }
        .ft-TWF  { background: #1e88e5; }
        .ft-RNF  { background: #757575; }
        .risk-high   { color: #c62828; font-weight: 700; }
        .risk-medium { color: #ef6c00; font-weight: 600; }
        .risk-low    { color: #2e7d32; }
    </style>
</head>
<body>
    <header>
        <a class="header-title" href="/" title="홈으로 새로고침">Robot Telemetry Portal</a>
        <div class="header-info" id="status-info">Loading...</div>
        <div class="dashboard-tabs">
            <button class="dashboard-tab active" data-uid="robot-fleet-001">Fleet</button>
            <button class="dashboard-tab" data-uid="anomaly-timeline-001">Anomaly</button>
            <button class="dashboard-tab" data-uid="pipeline-health-001">Pipeline</button>
        </div>
    </header>

    <div class="container">
        <div class="grafana-section">
            <div class="iframe-placeholder" id="iframe-placeholder">
                <div class="spinner"></div>
                <div id="iframe-placeholder-msg">Grafana 대시보드 로딩 중…</div>
            </div>
            <iframe id="grafana-frame" src=""></iframe>
        </div>

        <div class="right-column" style="display: flex; flex-direction: column; min-height: 0;">
        <div class="predict-section">
            <div class="predict-header">예측 점검 (Failure Type)</div>
            <div class="predict-form">
                <label class="full">
                    <span class="lbl-text">robot_id <span class="hint">예: ROBOT-00012</span></span>
                    <input id="pf-robot" placeholder="ROBOT-XXXXX" value="{{ robot_id }}">
                </label>
                <label>
                    <span class="lbl-text">평균 모터 온도 (°C) <span class="hint">정상 25~70</span></span>
                    <input id="pf-avg-temp" type="number" step="0.1" min="0" max="200" placeholder="예: 65.0">
                </label>
                <label>
                    <span class="lbl-text">최고 모터 온도 (°C) <span class="hint">90↑ 주의 / 100↑ 긴급</span></span>
                    <input id="pf-max-temp" type="number" step="0.1" min="0" max="200" placeholder="예: 95.0">
                </label>
                <label>
                    <span class="lbl-text">배터리 소모 (%) <span class="hint">70↑ 주의 / 95↑ 긴급</span></span>
                    <input id="pf-drain" type="number" step="1" min="0" max="100" placeholder="예: 60">
                </label>
                <label>
                    <span class="lbl-text">가동 시간 (h) <span class="hint">12↑ 주의 / 16↑ 긴급</span></span>
                    <input id="pf-hours" type="number" step="1" min="0" max="24" placeholder="예: 10">
                </label>
                <label class="full">
                    <span class="lbl-text">최고 온도 / 평균 온도 비율 <span class="hint">자동 계산 (직접 입력 가능)</span></span>
                    <input id="pf-ratio" type="number" step="0.001" min="0" placeholder="자동 계산됨">
                </label>
            </div>
            <div class="predict-actions">
                <button id="autofill-btn" class="autofill-btn" type="button" title="해당 robot_id 의 어제자 Gold 데이터로 5개 필드 자동 입력">자동 채우기</button>
                <button id="predict-btn" class="predict-btn">예측</button>
            </div>
            <div id="predict-result" class="predict-result"></div>
            <div class="ft-legend" aria-label="Failure Type 범례">
                <span class="item"><span class="ft-badge ft-NONE">NONE</span>정상</span>
                <span class="item"><span class="ft-badge ft-HDF">HDF</span>방열</span>
                <span class="item"><span class="ft-badge ft-PWF">PWF</span>전력</span>
                <span class="item"><span class="ft-badge ft-OSF">OSF</span>과부하</span>
                <span class="item"><span class="ft-badge ft-TWF">TWF</span>공구마모</span>
                <span class="item"><span class="ft-badge ft-RNF">RNF</span>랜덤</span>
            </div>
        </div>

        <div class="chat-section" style="flex: 1;">
            <div class="chat-header">AI 분석 상담</div>
            <div class="chat-messages" id="chat-messages">
                <div class="empty-state" id="empty-state">
                    <div class="icon">🔧</div>
                    <div>로봇 상태에 대해 자유롭게 물어보세요.</div>
                    <div class="examples">
                        <div class="example" data-q="오늘 점검이 시급한 로봇 3대 알려줘">💡 점검 시급한 로봇 3대</div>
                        <div class="example" data-q="모터 온도가 가장 높은 로봇은?">🌡️ 모터 온도 최고 로봇</div>
                        <div class="example" data-q="배터리 소모가 비정상적인 로봇 찾아줘">🔋 배터리 이상 로봇</div>
                    </div>
                </div>
            </div>
            <div class="typing" id="typing">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="로봇 상태를 물어보세요..." autocomplete="off">
                <button id="send-btn">전송</button>
            </div>
        </div>
        </div>
    </div>

    <script>
        // 이중 안전: SSM 값에 trailing slash 가 있어도 안전하게 정리 (main.py 도 rstrip 적용)
        const grafanaUrl = ("{{ GRAFANA_URL }}" || "http://localhost:3000").replace(/\/+$/, "");
        const robotId = "{{ robot_id }}";
        let currentDashboardUid = "robot-fleet-001";

        marked.setOptions({ breaks: true, gfm: true });

        async function loadStatus() {
            try {
                const resp = await fetch("/api/status");
                const data = await resp.json();
                if (data.cached_at && data.data_date) {
                    const cachedTime = new Date(data.cached_at).toLocaleTimeString('ko-KR');
                    document.getElementById('status-info').textContent =
                        `${data.data_date} 데이터 · ${cachedTime} 갱신`;
                }
            } catch (e) { console.error("Status load failed:", e); }
        }

        document.querySelectorAll('.dashboard-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.dashboard-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentDashboardUid = tab.dataset.uid;
                updateGrafanaFrame();
            });
        });

        function buildGrafanaUrl(uid, extraQuery = "") {
            const base = `${grafanaUrl}/d/${uid}?kiosk=tv&orgId=1`;
            return extraQuery ? `${base}&${extraQuery}` : base;
        }

        const iframePlaceholder = document.getElementById('iframe-placeholder');
        const iframePlaceholderMsg = document.getElementById('iframe-placeholder-msg');
        const grafanaFrame = document.getElementById('grafana-frame');
        let iframeLoadTimer = null;

        function showIframePlaceholder(msg = 'Grafana 대시보드 로딩 중…', isError = false) {
            iframePlaceholderMsg.textContent = msg;
            iframePlaceholder.classList.toggle('error', isError);
            iframePlaceholder.classList.remove('hidden');
        }
        function hideIframePlaceholder() { iframePlaceholder.classList.add('hidden'); }

        grafanaFrame.addEventListener('load', () => {
            if (iframeLoadTimer) { clearTimeout(iframeLoadTimer); iframeLoadTimer = null; }
            // src 가 빈 문자열로 초기화 시 발생하는 첫 load 는 무시
            if (grafanaFrame.src && grafanaFrame.src !== window.location.href) hideIframePlaceholder();
        });
        grafanaFrame.addEventListener('error', () => {
            showIframePlaceholder('⚠️ Grafana 대시보드를 불러오지 못했습니다. 네트워크 또는 권한을 확인하세요.', true);
        });

        function updateGrafanaFrame(extraQuery = "") {
            showIframePlaceholder();
            if (iframeLoadTimer) clearTimeout(iframeLoadTimer);
            iframeLoadTimer = setTimeout(() => {
                showIframePlaceholder('⚠️ Grafana 응답이 지연됩니다. URL/세션을 확인하거나 새로고침해 주세요.', true);
            }, 8000);
            grafanaFrame.src = buildGrafanaUrl(currentDashboardUid, extraQuery);
        }

        function hideEmptyState() {
            const el = document.getElementById('empty-state');
            if (el) el.remove();
        }

        function isNearBottom(el, threshold = 60) {
            return el.scrollHeight - el.scrollTop - el.clientHeight < threshold;
        }

        function addMessage(text, isUser, links = []) {
            hideEmptyState();
            const container = document.getElementById('chat-messages');
            const stick = isUser || isNearBottom(container);
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'assistant'}`;

            if (isUser) {
                msg.textContent = text;
            } else {
                const md = document.createElement('div');
                md.className = 'md-content';
                md.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
                msg.appendChild(md);
            }

            if (!isUser && links.length > 0) {
                const linksDiv = document.createElement('div');
                linksDiv.className = 'links-container';
                links.forEach(link => {
                    const btn = document.createElement('button');
                    btn.className = 'link-button';
                    btn.textContent = link.label;
                    btn.onclick = () => {
                        const qs = (link.url.split('?')[1] || "");
                        const params = new URLSearchParams(qs);
                        const rid = params.get('robot_id');
                        if (rid) {
                            // robot 링크 클릭 시 → Detail dashboard 강제 + var-robot_id 전달
                            // (Fleet Status 는 fleet 통계라 individual robot 필터링이 의미 없음)
                            const detailSrc = `${grafanaUrl}/d/robot-detail-001?kiosk=tv&orgId=1&var-robot_id=${encodeURIComponent(rid)}`;
                            document.getElementById('grafana-frame').src = detailSrc;
                        } else {
                            updateGrafanaFrame();
                        }
                    };
                    linksDiv.appendChild(btn);
                });
                msg.appendChild(linksDiv);
            }

            container.appendChild(msg);
            if (stick) container.scrollTop = container.scrollHeight;
        }

        function setLoading(on) {
            document.getElementById('typing').classList.toggle('show', on);
            document.getElementById('send-btn').disabled = on;
            if (on) {
                const c = document.getElementById('chat-messages');
                if (isNearBottom(c)) c.scrollTop = c.scrollHeight;
            }
        }

        async function sendChat(question) {
            const input = document.getElementById('chat-input');
            question = question || input.value.trim();
            if (!question) return;

            addMessage(question, true);
            input.value = '';
            setLoading(true);

            try {
                const resp = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });
                if (!resp.ok) {
                    const detail = await resp.text();
                    throw new Error(`HTTP ${resp.status}: ${detail}`);
                }
                const data = await resp.json();
                addMessage(data.answer, false, data.links || []);
            } catch (e) {
                addMessage(`⚠️ 오류가 발생했습니다: ${e.message}`, false);
            } finally {
                setLoading(false);
            }
        }

        document.getElementById('send-btn').addEventListener('click', () => sendChat());
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        document.querySelectorAll('.empty-state .example').forEach(el => {
            el.addEventListener('click', () => sendChat(el.dataset.q));
        });

        // robot_id 정규화: 백엔드 regex `^ROBOT-\d{5}$`에 맞도록
        // 대소문자/대괄호/en-em dash/zero-pad 자동 보정. 정규식과 무관한 문자열은 원본 유지.
        function normalizeRobotId(raw) {
            if (!raw) return '';
            const cleaned = raw.toUpperCase()
                .replace(/[‐-―]/g, '-')
                .replace(/[\[\]\s]/g, '');
            const m = cleaned.match(/^(?:ROBOT-)?(\d{1,5})$/);
            return m ? `ROBOT-${m[1].padStart(5, '0')}` : cleaned;
        }

        // Task 8.4: /api/predict 호출 + failure_type 뱃지 + recommended_action 표시
        async function runPredict() {
            const pfRobot   = document.getElementById('pf-robot');
            const robotId   = normalizeRobotId(pfRobot.value);
            if (robotId !== pfRobot.value) pfRobot.value = robotId;
            const avgTemp   = parseFloat(document.getElementById('pf-avg-temp').value);
            const maxTemp   = parseFloat(document.getElementById('pf-max-temp').value);
            const drain     = parseInt(document.getElementById('pf-drain').value, 10);
            const hours     = parseInt(document.getElementById('pf-hours').value, 10);
            const ratio     = parseFloat(document.getElementById('pf-ratio').value);
            const result    = document.getElementById('predict-result');

            if (!robotId || isNaN(avgTemp) || isNaN(maxTemp) || isNaN(drain) || isNaN(hours) || isNaN(ratio)) {
                result.classList.add('show');
                result.style.background = '#fff4e6';
                result.innerHTML = '⚠️ 모든 필드를 채워주세요.';
                return;
            }

            const btn = document.getElementById('predict-btn');
            btn.disabled = true;
            btn.textContent = '예측 중…';
            try {
                const resp = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        robot_id: robotId,
                        avg_motor_temp: avgTemp,
                        max_motor_temp: maxTemp,
                        battery_drain: drain,
                        active_hours: hours,
                        max_temp_load_ratio: ratio,
                    }),
                });
                let payload = null;
                try { payload = await resp.json(); } catch (_) { /* non-JSON body */ }
                if (!resp.ok) {
                    result.classList.add('show');
                    const detail = payload && payload.detail;
                    if (resp.status === 503 && detail && detail.reason === 'endpoint_offline') {
                        result.style.background = '#e3f2fd';
                        result.innerHTML = `
                            <div style="font-weight:600;">🛈 예측 모델 일시 오프라인</div>
                            <div style="margin-top:6px;color:var(--text-secondary);">${detail.message}</div>
                            <div style="margin-top:4px;font-size:12px;color:var(--text-secondary);">endpoint=${detail.endpoint}</div>`;
                    } else {
                        result.style.background = '#ffebee';
                        const msg = (detail && (typeof detail === 'string' ? detail : detail.message)) || resp.statusText;
                        result.innerHTML = `⚠️ 예측 실패: HTTP ${resp.status}: ${msg}`;
                    }
                    return;
                }
                const data = payload;
                const ft = data.predicted_failure_type;
                const dist = data.failure_distribution || {};
                const distLine = Object.entries(dist)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 3)
                    .map(([k, v]) => `${k}=${(v * 100).toFixed(1)}%`)
                    .join(' · ');
                result.classList.add('show');
                result.style.background = ft === 'NONE' ? '#e8f5e9' : '#fff8e1';
                result.innerHTML = `
                    <div><span class="ft-badge ft-${ft}">${ft}</span>
                    <span class="risk-${data.risk_level}">[${data.risk_level.toUpperCase()}]</span>
                    fault_prob=${(data.fault_probability * 100).toFixed(1)}%</div>
                    <div style="margin-top:6px;color:var(--text-secondary);">${distLine}</div>
                    <div style="margin-top:6px;">${data.recommended_action}</div>
                `;
            } catch (e) {
                result.classList.add('show');
                result.style.background = '#ffebee';
                result.innerHTML = `⚠️ 예측 실패: ${e.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = '예측';
            }
        }
        document.getElementById('predict-btn').addEventListener('click', runPredict);

        // ratio 자동 계산 (avg + max 둘 다 입력 시, ratio 가 비어 있을 때만)
        function maybeAutoComputeRatio() {
            const avg = parseFloat(document.getElementById('pf-avg-temp').value);
            const max = parseFloat(document.getElementById('pf-max-temp').value);
            const ratioEl = document.getElementById('pf-ratio');
            if (!ratioEl.dataset.userTouched && !isNaN(avg) && !isNaN(max) && avg > 0) {
                ratioEl.value = (max / avg).toFixed(3);
            }
        }
        document.getElementById('pf-avg-temp').addEventListener('input', maybeAutoComputeRatio);
        document.getElementById('pf-max-temp').addEventListener('input', maybeAutoComputeRatio);
        document.getElementById('pf-ratio').addEventListener('input', () => {
            document.getElementById('pf-ratio').dataset.userTouched = '1';
        });

        // 자동 채우기: GET /api/robot/{id}/recent-features
        async function autofillFromGold() {
            const pfRobot = document.getElementById('pf-robot');
            const rid = normalizeRobotId(pfRobot.value);
            if (rid !== pfRobot.value) pfRobot.value = rid;
            const result = document.getElementById('predict-result');
            if (!rid) {
                result.classList.add('show');
                result.style.background = '#fff4e6';
                result.innerHTML = '⚠️ 먼저 robot_id 를 입력하세요.';
                return;
            }
            const btn = document.getElementById('autofill-btn');
            btn.disabled = true;
            const orig = btn.textContent;
            btn.textContent = '불러오는 중…';
            try {
                const resp = await fetch(`/api/robot/${encodeURIComponent(rid)}/recent-features`);
                if (!resp.ok) {
                    let detail = resp.statusText;
                    try { const j = await resp.json(); detail = j.detail || detail; } catch (_) {}
                    result.classList.add('show');
                    result.style.background = '#ffebee';
                    result.innerHTML = `⚠️ 자동 채우기 실패: HTTP ${resp.status} — ${detail}`;
                    return;
                }
                const d = await resp.json();
                document.getElementById('pf-avg-temp').value  = d.avg_motor_temp;
                document.getElementById('pf-max-temp').value  = d.max_motor_temp;
                document.getElementById('pf-drain').value     = d.battery_drain;
                document.getElementById('pf-hours').value     = d.active_hours;
                const ratioEl = document.getElementById('pf-ratio');
                ratioEl.value = d.max_temp_load_ratio;
                delete ratioEl.dataset.userTouched;
                result.classList.add('show');
                result.style.background = '#e8f5e9';
                const srcTag = d.source === 'athena' ? ' (Athena 직접 조회)' : '';
                result.innerHTML = `✓ ${d.robot_id} 의 ${d.data_date} 데이터로 채움${srcTag} — 이제 [예측] 버튼을 누르세요.`;
            } catch (e) {
                result.classList.add('show');
                result.style.background = '#ffebee';
                result.innerHTML = `⚠️ 자동 채우기 실패: ${e.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = orig;
            }
        }
        document.getElementById('autofill-btn').addEventListener('click', autofillFromGold);

        // 입력 필드를 떠날 때 즉시 canonical 형태(`ROBOT-00037`)로 보정
        // — 사용자가 robot-37 / 37 / [robot-37] 등으로 쳐도 Tab/blur 시 시각적으로 통일됨
        document.getElementById('pf-robot').addEventListener('blur', (e) => {
            const normalized = normalizeRobotId(e.target.value);
            if (normalized && normalized !== e.target.value) e.target.value = normalized;
        });

        loadStatus();
        updateGrafanaFrame();

        // URL 의 robot_id 는 자동 챗 발송 대신 사용자 액션 칩으로 노출 (비용·의도 보존)
        if (robotId) {
            const c = document.getElementById('chat-messages');
            const empty = document.getElementById('empty-state');
            const chip = document.createElement('div');
            chip.className = 'example';
            chip.style.cssText = 'margin: 0 16px 12px; padding: 10px 14px; background: var(--primary-light); border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--primary-dark); font-weight: 600; text-align: center;';
            chip.textContent = `▶ ${robotId} 현재 상태 분석 시작`;
            chip.addEventListener('click', () => {
                chip.remove();
                sendChat(`${robotId}의 현재 상태를 분석해줘`);
            });
            (empty || c).insertAdjacentElement(empty ? 'beforebegin' : 'afterbegin', chip);
        }
    </script>
</body>
</html>
