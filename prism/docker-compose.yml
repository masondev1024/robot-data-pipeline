# PRISM 운영 콘솔 — 단일 호스트 배포.
# 사용: cd prism/ && cp .env.example .env && docker compose up --build

services:
  demo-app:
    build:
      context: ..
      dockerfile: prism/Dockerfile.app
    image: prism-app:local
    container_name: prism-demo-app
    env_file: .env
    command: ["streamlit", "run", "apps/prism_demo.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - PRISM_MODE=demo
    ports:
      - "${DEMO_PORT:-8501}:8501"
    volumes:
      - ../data:/app/data
      - ../assets:/app/assets:ro
      - ../presentation:/app/presentation:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  live-app:
    build:
      context: ..
      dockerfile: prism/Dockerfile.app
    image: prism-app:local
    container_name: prism-live-app
    env_file: .env
    command: ["streamlit", "run", "apps/prism_demo.py", "--server.port=8502", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      - STREAMLIT_SERVER_PORT=8502
      - PRISM_MODE=live
    ports:
      - "${LIVE_PORT:-8502}:8502"
    volumes:
      - ../data:/app/data
      - ../assets:/app/assets:ro
      - ../presentation:/app/presentation:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  operator-app:
    build:
      context: ..
      dockerfile: prism/Dockerfile.app
    image: prism-app:local
    container_name: prism-operator-app
    env_file: .env
    command: ["streamlit", "run", "apps/prism_operator_demo.py", "--server.port=8503", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      - STREAMLIT_SERVER_PORT=8503
      - PRISM_MODE=demo
    ports:
      - "${OPERATOR_PORT:-8503}:8503"
    volumes:
      - ../data:/app/data
      - ../assets:/app/assets:ro
      - ../presentation:/app/presentation:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8503/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

# CNC stream generator 는 현 PRISM Streamlit 안에서 직접 tick 을 돌리므로 별도 컨테이너 불필요.
# 1000대 robot scale-up 시에만 legacy/k8s/generator/ 의 StatefulSet 으로 분리.
