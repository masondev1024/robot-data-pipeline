name: prism-public

services:
  operator-app:
    image: "${PRISM_PUBLIC_OPERATOR_IMAGE:-prism-public-operator:local}"
    build:
      context: ..
      dockerfile: prism/Dockerfile.app
      args:
        PUBLIC_STREAMLIT_CONFIG: "true"
    command: ["streamlit", "run", "apps/prism_operator_demo.py", "--server.port=8503", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      HOME: /tmp
      PRISM_MODE: demo
      PRISM_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "2026"
      STREAMLIT_SERVER_PORT: "8503"
    expose:
      - "8503"
    volumes:
      - prism-public-data:/app/data
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8503/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app

  caddy:
    image: "${PRISM_PUBLIC_CADDY_IMAGE:-prism-public-caddy:local}"
    build:
      context: ..
      dockerfile: prism/Dockerfile.caddy
    depends_on:
      operator-app:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}"
      CADDY_ACME_EMAIL: "${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}"
      CADDY_BASIC_AUTH_USER: "${CADDY_BASIC_AUTH_USER:?CADDY_BASIC_AUTH_USER is required}"
      CADDY_BASIC_AUTH_HASH: "${CADDY_BASIC_AUTH_HASH:?CADDY_BASIC_AUTH_HASH is required}"
    ports:
      - "${PRISM_HTTP_PORT:-80}:80"
      - "${PRISM_HTTPS_PORT:-443}:443"
      - "${PRISM_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app
      - edge

volumes:
  prism-public-data:
    name: prism-public-data
  caddy-data:
    name: prism-public-caddy-data
  caddy-config:
    name: prism-public-caddy-config

networks:
  app:
    internal: true
  edge:
