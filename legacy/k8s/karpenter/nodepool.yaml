# Karpenter v1 spec — Karpenter v1.0+ (2024-08 GA 이후)
# 사유: v1beta1은 strict decoding에서 일부 필드(disruption.budgets[].reasons,
# subnetSelector 등)가 거부됨. v1이 안전 + 미래 호환.

# ============================================================
# NodePool: default (batch workloads — workload=batch:NoSchedule taint)
# ============================================================
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.large", "t3.xlarge", "t3a.large", "t3a.xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: workload
          value: batch
          effect: NoSchedule
      # v1: expireAfter는 template.spec으로 이동
      expireAfter: 720h
  limits:
    cpu: 100
    memory: 100Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"
        duration: 5m
        schedule: "0 9 * * mon-fri"
        reasons:
          - "Underutilized"
          - "Empty"
      - nodes: "100%"
        reasons:
          - "Drifted"

---
# ============================================================
# NodePool: general (taintless — api/generator 자동 수용)
# ============================================================
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    spec:
      requirements:
        # spot 우선, on-demand fallback (Karpenter는 cheapest 선택)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Instance family 다양성
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c5", "c5a", "m5", "m5a", "t3", "t3a"]
        # Instance size
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge"]
        # AZ a/b only (cluster has no private subnet in eu-west-1c)
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["eu-west-1a", "eu-west-1b"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # taints 없음 — general workload 자동 수용
      expireAfter: 720h
  limits:
    cpu: 200
    memory: 200Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      # default budget — 항상 적용 (schedule/duration 없음 = 24/7)
      - nodes: "20%"
      - nodes: "100%"
        reasons:
          - "Drifted"

---
# ============================================================
# EC2NodeClass: default (두 NodePool 공유)
# ============================================================
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # v1: amiSelectorTerms 필수 (v1.0에서 명시 의무화)
  # alias 사용 시 EKS-optimized AMI 자동 선택
  amiSelectorTerms:
    - alias: al2@latest

  # IAM Role — Karpenter가 자동으로 매칭하는 instance profile 생성/관리
  role: "robot-telemetry-karpenter-node-role"

  # v1: subnetSelector → subnetSelectorTerms (list of terms)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "robot-telemetry-cluster"

  # v1: securityGroupSelector → securityGroupSelectorTerms (list of terms)
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "robot-telemetry-cluster"

  tags:
    Name: "robot-telemetry-karpenter-node"
    Environment: "dev"
    ManagedBy: "karpenter"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
