apiVersion: v1
kind: Service
metadata:
  name: robot-telemetry-generator-headless
  namespace: robot-telemetry
  labels:
    app: robot-telemetry-generator
spec:
  clusterIP: None
  selector:
    app: robot-telemetry-generator
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: robot-telemetry-generator
  namespace: robot-telemetry
  labels:
    app: robot-telemetry-generator
spec:
  serviceName: robot-telemetry-generator-headless
  replicas: 10
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: robot-telemetry-generator
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app: robot-telemetry-generator
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      serviceAccountName: generator-sa
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: robot-telemetry-generator
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: robot-telemetry-generator
                topologyKey: kubernetes.io/hostname
      containers:
        - name: generator
          image: 827913617635.dkr.ecr.eu-west-1.amazonaws.com/robot-telemetry-generator:latest
          env:
            # SIGUSR1 핸들러 print() 즉시 flush — 옛 Deployment 시점 회귀 방지.
            - name: PYTHONUNBUFFERED
              value: "1"
            # StatefulSet ordinal 기반 robot ID range 결정 — _resolve_robot_id_range().
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 1000 robots 분할: 각 pod 100대 담당. POD_TOTAL_REPLICAS 는
            # spec.replicas 와 항상 동일해야 함 (1단계 HPA 잠금이라 10 고정).
            # 2단계 진입 시 (Downward API 옵션 B) 동기화 reconciler 추가 필요.
            - name: TOTAL_ROBOTS
              value: "1000"
            - name: POD_TOTAL_REPLICAS
              value: "10"
            # 1Hz tick — 1000대 production 표준.
            - name: TICK_INTERVAL_SECONDS
              value: "1.0"
            - name: KINESIS_STREAM_NAME
              value: "robot-telemetry-stream"
            - name: KINESIS_ALERT_STREAM_NAME
              value: "robot-anomaly-alert-stream"
            - name: AWS_DEFAULT_REGION
              value: "eu-west-1"
            - name: SEED_CSV_PATH
              value: "/data/seed_data_sample.csv"
            # Fault episode entry probability — robot 수 무관 (개당 비율).
            - name: FAULT_ENTRY_PROB
              value: "0.0005"
            # Hour-of-day variance: peak 1.0 (UTC 14h), trough 0.6 (UTC 02h).
            - name: HOUR_LOAD_VARIANCE
              value: "0.4"
          volumeMounts:
            - name: seed-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
      volumes:
        - name: seed-data
          configMap:
            name: generator-seed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: generator-sa
  namespace: robot-telemetry
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::827913617635:role/robot-telemetry-generator-irsa
