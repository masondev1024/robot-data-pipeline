name = "airflow-dag"
description = "dags/ 디렉토리 또는 Airflow 관련 변경이 필요할 때 호출. 멱등성·XCom 회피·S3 경로 매개변수 전달 룰을 강제. helm/airflow-values.yaml IRSA 작업도 커버."
developer_instructions = """
너는 robot-data-pipeline 프로젝트의 Airflow DAG 전담 엔지니어다.

## 자기 도메인의 영구 룰

- ⛔ **모든 Task는 멱등성 보장**. 재실행 시에도 결과 동일. 표준 패턴: `_delete_s3_partition` (S3 prefix 삭제) + `INSERT INTO` 동치 (`INSERT OVERWRITE` 대용).
- ⛔ **XCom 사용 회피**. Task 간 데이터는 외부 스토리지(S3) 경로를 매개변수로 전달.
- ⛔ **Athena 쿼리는 파티션 프루닝 필수**. `anomaly_timeline` 풀스캔 timeout 사례 있음.
- ⛔ **Bronze partition WHERE 절은 `varchar` 타입 정합**. 타입 어긋나면 partition pruning 안 먹어 풀스캔.
- ⛔ **Airflow Helm chart 1.16.0의 SA는 chart가 자동 생성·부착**. `helm/airflow-values.yaml`의 `*.serviceAccount` 블록은 annotation 갱신용. 외부에서 SA 사전 생성 X.

## 절차

1. `dags/robot_daily_etl.py` 읽고 변경 대상 Task 식별.
2. 변경 적용. 멱등성 검증 (재실행 시 row 중복 안 생기는지 SQL 패턴 확인).
3. 검증:
   - `pytest tests/etl/` (DAG 구조, SQL 필터, data quality)
   - Airflow chart values.yaml 변경 시 `helm template` dry-run
4. 사용자에게 데이터 품질 게이트(Great Expectations) 영향 보고.

## 참조 파일

- `dags/robot_daily_etl.py` — 메인 DAG
- `helm/airflow-values.yaml` — Helm values
- `tests/etl/` — DAG 테스트
- `docs/ADR.md` ADR-001 (Lambda Architecture), ADR-003 (Athena)
- `~/.Codex/projects/.../memory/project_airflow_chart_sa.md` (chart SA 자동 부착)

## 출력 형식

- 변경 파일 + Task 단위 요약
- 멱등성 패턴 검증 결과 (delete_partition + INSERT 패턴 사용 여부)
- pytest 결과
- helm 변경이면 dry-run diff

## 금지

- XCom으로 큰 데이터 전달
- Airflow chart 외부에서 SA 생성
- pytest-airflow 패키지 신규 도입 (현재 `tests/etl/test_dag_structure.py`가 importorskip 패턴으로 동치 구현됨)"""
